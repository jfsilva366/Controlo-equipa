<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111214"><title>Atlas</title><link rel="stylesheet" href="styles.css"></head><body><div id="loading" class="screen center">A iniciar Atlas…</div><section id="login" class="screen center hidden"><form id="loginForm" class="login-card"><div class="logo">A</div><p class="kicker">GESTÃO OPERACIONAL</p><h1>Atlas</h1><label>Email<input id="email" type="email" autocomplete="email" required></label><label>Palavra-passe<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">Entrar</button><p id="loginError" class="error"></p></form></section><div id="app" class="app hidden"><aside class="sidebar"><div><div class="brand"><span class="logo small">A</span><strong>Atlas</strong></div><nav><button class="active" data-view="tasks">Tarefas</button><button data-view="validations">Validações <b id="navReview">0</b></button><button data-view="team" class="admin-only">Equipa</button><button data-view="reports" class="admin-only">Relatórios</button></nav></div><div><button id="themeBtn">Alterar tema</button><button id="logoutBtn">Terminar sessão</button></div></aside><main><header><div><p class="kicker">CENTRO DE OPERAÇÕES</p><h1 id="hello">Olá</h1></div><button id="newTaskBtn" class="primary admin-only">+ Nova tarefa</button></header><section id="stats" class="stats"><button data-filter="active"><span>Ativas</span><b id="statActive">0</b></button><button data-filter="late"><span>Em atraso</span><b id="statLate">0</b></button><button data-filter="review"><span>A validar</span><b id="statReview">0</b></button></section><section id="prioritySection"><div class="section-head"><div><p class="kicker">FOCO IMEDIATO</p><h2>Prioridade máxima</h2></div></div><div id="priorityList" class="priority-list"></div></section><section><div class="section-head"><div><p class="kicker">PLANEAMENTO</p><h2 id="listTitle">Tarefas</h2></div><div class="quick-filters"><button class="active" data-filter="active">Ativas</button><button data-filter="today">Hoje</button><button data-filter="late">Em atraso</button><button data-filter="critical">Críticas</button></div></div><div id="peopleTabs" class="people-tabs"></div><div id="taskList" class="task-list"></div></section><section id="teamView" class="hidden"><div class="section-head"><div><p class="kicker">EQUIPA</p><h2>Colaboradores</h2></div><button id="openPeopleBtn">Gerir acessos</button></div><div id="teamList" class="team-list"></div></section><section id="reportsView" class="hidden"><div class="section-head"><div><p class="kicker">ANÁLISE</p><h2>Relatórios</h2></div><button id="exportBtn">Exportar CSV</button></div><div id="reportCards" class="stats report"></div></section></main><nav class="mobile-nav"><button class="active" data-view="tasks">Tarefas</button><button data-view="validations">Validar</button><button data-view="team" class="admin-only">Equipa</button><button data-view="reports" class="admin-only">Relatórios</button></nav></div><dialog id="taskDialog"><form id="taskForm" method="dialog"><div class="dialog-head"><h2 id="dialogTitle">Nova tarefa</h2><button type="button" data-close>×</button></div><input id="taskId" type="hidden"><label>Tarefa<input id="taskTitle" required></label><div class="grid"><label>Atribuir a<select id="taskPerson"></select></label><label>Prioridade<select id="taskPriority"><option value="low">Baixa</option><option value="medium">Média</option><option value="high">Alta</option><option value="critical">Crítica</option></select></label><label>Data limite<input id="taskDate" type="date"></label><label>Hora<input id="taskTime" type="time"></label><label>Estado<select id="taskStatus"><option value="todo">Por iniciar</option><option value="in_progress">Em curso</option><option value="review">A validar</option><option value="done">Validada</option></select></label></div><label>Observações<textarea id="taskNotes"></textarea></label><div class="dialog-actions"><button id="deleteBtn" type="button" class="danger">Eliminar</button><span></span><button type="button" data-close>Cancelar</button><button type="submit" class="primary">Guardar</button></div></form></dialog><div id="toast" class="toast"></div><script src="../config.js"></script><script type="module" src="app.js"></script></body></html>
